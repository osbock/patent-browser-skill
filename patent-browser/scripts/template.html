<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patent browser</title>
<style>
:root{
  --bg:#f6f5f1; --panel:#ffffff; --ink:#1b1d21; --muted:#636872; --line:#dcd9d0; --accent:#0b5cad; --accent-ink:#ffffff;
  --chip:#ecebe5; --chip-ink:#34373d; --mark:#ffe58a; --warn-bg:#fff4d6; --warn-ink:#6b4a00; --shadow:0 1px 2px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171a; --panel:#1e2125; --ink:#e8e6e1; --muted:#9aa0a8; --line:#33373d; --accent:#6db3ff; --accent-ink:#0c1620;
    --chip:#2a2e34; --chip-ink:#d5d7da; --mark:#6b5a12; --warn-bg:#3a3010; --warn-ink:#f1d98a; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#15171a; --panel:#1e2125; --ink:#e8e6e1; --muted:#9aa0a8; --line:#33373d; --accent:#6db3ff; --accent-ink:#0c1620;
  --chip:#2a2e34; --chip-ink:#d5d7da; --mark:#6b5a12; --warn-bg:#3a3010; --warn-ink:#f1d98a; --shadow:none;
}
*{box-sizing:border-box}
html{scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
button{font:inherit;color:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 20px 10px}
.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h1{font-size:18px;margin:0;font-weight:650;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px}
.spacer{flex:1}
.search{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
#q{flex:1;min-width:160px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit}
#q:focus{outline:2px solid var(--accent);outline-offset:-1px}
select,.btn{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit}
.btn:hover{border-color:var(--accent)}
.tabs{display:flex;gap:4px;margin-top:10px;overflow-x:auto}
.tab{white-space:nowrap}
main{min-width:0}
.layout.wide{grid-template-columns:minmax(0,1fr)}
.layout.wide aside{display:none}
.tab{border:0;background:none;padding:6px 12px;border-radius:7px;color:var(--muted);font-weight:550}
.tab[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow);border:1px solid var(--line)}
.layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:20px;padding:16px 20px 60px;max-width:1500px;margin:0 auto}
aside{position:sticky;top:138px;align-self:start;max-height:calc(100vh - 150px);overflow:auto;padding-right:4px}
aside h2{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:14px 0 6px;font-weight:650}
aside h2:first-child{margin-top:0}
.facet{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;border:0;background:none;padding:4px 8px;border-radius:6px;font-size:13.5px}
.facet:hover{background:var(--chip)}
.facet.on{background:var(--accent);color:var(--accent-ink)}
.facet .ct{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}
.facet.on .ct{color:inherit;opacity:.85}
.status{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px;color:var(--muted);font-size:13px;min-height:28px}
.pill{display:inline-flex;gap:6px;align-items:center;background:var(--accent);color:var(--accent-ink);border:0;border-radius:99px;padding:2px 10px;font-size:12.5px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:10px;box-shadow:var(--shadow)}
.card>summary{list-style:none;cursor:pointer;padding:12px 16px}
.card>summary::-webkit-details-marker{display:none}
.card[open]>summary{border-bottom:1px solid var(--line)}
.row1{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.num{font-variant-numeric:tabular-nums;font-weight:650;white-space:nowrap}
.title{font-weight:600;flex:1;min-width:200px}
.meta{color:var(--muted);font-size:12.5px;margin-top:2px}
.sum{margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{background:var(--chip);color:var(--chip-ink);border:0;border-radius:99px;padding:1px 9px;font-size:12px}
button.chip:hover{outline:1px solid var(--accent)}
.theme{background:none;border:1px solid var(--line);color:var(--muted)}
.body{padding:12px 16px 16px}
.body h3{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:14px 0 4px;font-weight:650}
.body h3:first-child{margin-top:0}
.body ul{margin:4px 0;padding-left:20px}
.body p{margin:4px 0}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.links a{border:1px solid var(--line);border-radius:7px;padding:4px 10px;font-size:13px;background:var(--bg)}
.links a.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.claim{font-size:13.5px;color:var(--ink);background:var(--bg);border-radius:8px;padding:10px 12px;white-space:pre-wrap}
.flag{background:var(--warn-bg);color:var(--warn-ink);border-radius:7px;padding:6px 10px;font-size:13px;margin-bottom:10px}
.kv{display:grid;grid-template-columns:120px 1fr;gap:2px 12px;font-size:13.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
.more{display:block;margin:16px auto;padding:9px 18px}
.idx{columns:3 260px;column-gap:28px}
.idx section{margin-bottom:18px}
.idx .fam,.idx section>h3{break-inside:avoid}
.idx h3{font-size:14px;margin:0 0 6px}
.idx button{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;border:0;background:none;padding:3px 6px;border-radius:6px;font-size:13.5px}
.idx button:hover{background:var(--chip)}
.idx .ct{color:var(--muted);font-size:12px}
.idx .fam{margin:0 0 10px}
.idx .fam button{font-weight:600}
.idx .fam ul{margin:0 0 0 6px;padding-left:18px;font-size:13.5px;color:var(--ink)}
.idx.uses{columns:2 380px}
.note{color:var(--muted);font-size:13px;max-width:900px;margin:0 0 16px}
table{border-collapse:collapse;width:100%;font-size:13.5px;background:var(--panel)}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.empty{padding:40px;text-align:center;color:var(--muted)}
@media (max-width:860px){
  .layout{grid-template-columns:1fr;padding:12px 16px 60px}
  aside{position:static;max-height:none;display:none}
  aside.show{display:block}
  header{padding:10px 16px}
  .kv{grid-template-columns:1fr}
}
@media (min-width:861px){#filt{display:none}}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1 id="h1">Patent browser</h1>
    <span class="sub" id="sub"></span>
    <span class="spacer"></span>
    <button class="btn" id="themeBtn" title="Toggle light/dark">◐</button>
  </div>
  <div class="search">
    <input id="q" type="search" placeholder="Search titles, numbers, inventors, concepts, use cases, abstracts, claims…  (use &quot;quotes&quot; for phrases, -word to exclude)" autocomplete="off">
    <select id="sort" title="Sort">
      <option value="rel">Sort: relevance</option>
      <option value="new">Newest grant</option>
      <option value="old">Oldest grant</option>
      <option value="prio">Earliest priority</option>
      <option value="num">Patent number</option>
    </select>
    <button class="btn" id="filt">Filters</button>
  </div>
  <div class="tabs" role="tablist">
    <button class="tab" data-view="list">Patents</button>
    <button class="tab" data-view="concepts">Concepts</button>
    <button class="tab" data-view="uses">Use cases</button>
    <button class="tab" data-view="families">Families</button>
    <button class="tab" data-view="about">About the data</button>
  </div>
</header>
<div class="layout">
  <aside id="side"></aside>
  <main id="main"></main>
</div>
<script id="data" type="application/json">__DATA__</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const P = D.patents, FAM = D.families, THEMES = D.themes;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtNum = n => 'US ' + Number(n).toLocaleString('en-US');
const byN = Object.fromEntries(P.map(p => [p.n, p]));
P.forEach(p => {
  const f = FAM[p.fam];
  p.F = f;
  p.hayHi = [p.n, fmtNum(p.n), p.id, p.title, p.inv.join(' '), p.focus, f.summary, f.concepts.join(' '), f.uses.join(' '), f.useTags.join(' '), THEMES[f.theme], p.app].join(' \n ').toLowerCase();
  p.hayLo = [p.abstract, p.claim1, p.cpc.join(' ')].join(' \n ').toLowerCase();
});
const state = {view:'list', q:'', sort:'rel', theme:'', concept:'', use:'', inv:'', year:'', fam:'', limit:60};

function parseQ(q){
  const t = []; const re = /(-?)"([^"]+)"|(-?)(\S+)/g; let m;
  while ((m = re.exec(q.toLowerCase()))) { const neg = (m[1]||m[3]) === '-'; let w = (m[2]||m[4]).replace(/,(?=\d{3})/g,''); if (w) t.push({w, neg}); }
  return t;
}
function filtered(){
  const terms = parseQ(state.q);
  let out = [];
  for (const p of P){
    const f = p.F;
    if (state.theme && f.theme !== state.theme) continue;
    if (state.concept && !f.concepts.includes(state.concept)) continue;
    if (state.use && !f.useTags.includes(state.use)) continue;
    if (state.inv && !p.inv.includes(state.inv)) continue;
    if (state.year && p.granted.slice(0,4) !== state.year) continue;
    if (state.fam && p.fam !== state.fam) continue;
    let score = 0, ok = true;
    for (const {w, neg} of terms){
      const hi = p.hayHi.replace(/,(?=\d{3})/g,'').includes(w), lo = p.hayLo.includes(w);
      if (neg) { if (hi || lo) { ok = false; break; } continue; }
      if (!hi && !lo) { ok = false; break; }
      score += (p.title.toLowerCase().includes(w) ? 6 : 0) + (hi ? 3 : 0) + (lo ? 1 : 0) + (p.n === w ? 50 : 0);
    }
    if (ok) { p._s = score; out.push(p); }
  }
  const s = state.sort === 'rel' ? (terms.length ? 'rel' : 'new') : state.sort;
  const cmp = {
    rel:(a,b)=> b._s - a._s || b.granted.localeCompare(a.granted),
    new:(a,b)=> b.granted.localeCompare(a.granted) || b.n - a.n,
    old:(a,b)=> a.granted.localeCompare(b.granted) || a.n - b.n,
    prio:(a,b)=> a.prio.localeCompare(b.prio) || a.n - b.n,
    num:(a,b)=> a.n - b.n,
  }[s];
  return out.sort(cmp);
}
function hl(text){
  let h = esc(text);
  const terms = parseQ(state.q).filter(t => !t.neg && t.w.length > 1).map(t => t.w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
  if (!terms.length) return h;
  return h.replace(new RegExp('(' + terms.join('|') + ')', 'gi'), '<mark>$1</mark>');
}
function counts(list, fn){
  const c = new Map();
  for (const p of list) for (const k of [].concat(fn(p))) c.set(k, (c.get(k)||0) + 1);
  return [...c.entries()];
}
function facetBlock(title, key, entries, label = k => k, max = 400){
  if (!entries.length) return '';
  return `<h2>${title}</h2>` + entries.slice(0, max).map(([k, n]) =>
    `<button class="facet ${state[key]===k?'on':''}" data-set="${key}" data-val="${esc(k)}"><span>${esc(label(k))}</span><span class="ct">${n}</span></button>`).join('');
}
function renderSide(list){
  const th = counts(list, p => p.F.theme).sort((a,b)=> a[0].localeCompare(b[0]));
  const yr = counts(list, p => p.granted.slice(0,4)).sort((a,b)=> b[0].localeCompare(a[0]));
  const co = counts(list, p => p.F.concepts).sort((a,b)=> b[1]-a[1] || a[0].localeCompare(b[0]));
  const us = counts(list, p => p.F.useTags).sort((a,b)=> b[1]-a[1] || a[0].localeCompare(b[0]));
  const iv = counts(list, p => p.inv).sort((a,b)=> b[1]-a[1] || a[0].localeCompare(b[0]));
  $('#side').innerHTML =
    facetBlock('Theme','theme',th,k=>THEMES[k]) +
    facetBlock('Use-case area','use',us) +
    facetBlock('Grant year','year',yr) +
    facetBlock('Concept','concept',co,k=>k,40) +
    facetBlock('Inventor','inv',iv,k=>k,30);
}
function card(p, open){
  const f = p.F, sibs = f.members.filter(n => n !== p.n);
  return `<details class="card" id="p${p.n}" ${open?'open':''}>
  <summary>
    <div class="row1"><span class="num">${hl(fmtNum(p.n))} ${p.kind}</span><span class="title">${hl(p.title)}</span></div>
    <div class="meta">Granted ${p.granted} · Priority ${p.prio} · ${hl(p.inv.join(', '))}</div>
    <div class="sum">${hl(p.focus || f.summary)}</div>
    <div class="chips"><span class="chip theme">${esc(THEMES[f.theme])}</span>${f.concepts.map(c=>`<button class="chip" data-set="concept" data-val="${esc(c)}">${hl(c)}</button>`).join('')}</div>
  </summary>
  <div class="body" data-n="${p.n}"></div></details>`;
}
function body(p){
  const f = p.F, sibs = f.members.filter(n => n !== p.n);
  return `${p.flag ? `<div class="flag">⚠ ${esc(p.flag)}</div>` : ''}
    <div class="links">
      <a class="primary" href="${p.pdf}" target="_blank" rel="noopener">PDF (local)</a>
      <a href="https://ppubs.uspto.gov/pubwebapp/external.html?q=(${p.n}).pn.&db=USPAT&type=queryString" target="_blank" rel="noopener">USPTO full text</a>
      <a href="https://image-ppubs.uspto.gov/dirsearch-public/print/downloadPdf/${p.n}" target="_blank" rel="noopener">USPTO PDF</a>
      <a href="https://patentcenter.uspto.gov/applications/${p.app.replace(/\D/g,'')}" target="_blank" rel="noopener">Patent Center (file history)</a>
      <a href="https://patents.google.com/patent/${p.id}/en" target="_blank" rel="noopener">Google Patents</a>
    </div>
    ${p.focus ? `<h3>What this patent claims</h3><p>${hl(p.focus)}</p>` : ''}
    <h3>Family summary</h3><p>${hl(f.summary)}</p>
    <h3>Use cases</h3><ul>${f.uses.map(u=>`<li>${hl(u)}</li>`).join('')}</ul>
    <div class="chips">${f.useTags.map(c=>`<button class="chip" data-set="use" data-val="${esc(c)}">${esc(c)}</button>`).join('')}</div>
    <h3>Details</h3>
    <dl class="kv">
      <dt>Application</dt><dd>${esc(p.app)}, filed ${p.filed}</dd>
      <dt>Inventors</dt><dd>${p.inv.map(i=>`<a href="#" data-set="inv" data-val="${esc(i)}">${hl(i)}</a>`).join(', ')}</dd>
      <dt>Assignee</dt><dd>${esc(p.assignee)}</dd>
      <dt>Size</dt><dd>${p.nclaims} claims · ${p.pages} pages</dd>
      <dt>CPC</dt><dd>${hl(p.cpc.join(', '))}</dd>
      ${sibs.length ? `<dt>Same family</dt><dd>${sibs.map(n=>`<a href="#" data-goto="${n}">${fmtNum(n)}</a>`).join(', ')} · <a href="#" data-set="fam" data-val="${p.fam}">show all ${f.members.length}</a></dd>` : ''}
    </dl>
    <h3>Abstract (USPTO)</h3><p>${hl(p.abstract)}</p>
    <h3>Claim 1 (USPTO)</h3><div class="claim">${hl(p.claim1)}</div>`;
}
function renderList(){
  const list = filtered();
  renderSide(list);
  const pills = [['theme',k=>THEMES[k]],['use',k=>k],['concept',k=>k],['inv',k=>k],['year',k=>k],['fam',k=>'Family: '+FAM[k].title]]
    .filter(([k]) => state[k]).map(([k,l]) => `<button class="pill" data-set="${k}" data-val="${esc(state[k])}">${esc(l(state[k]))} ✕</button>`).join('');
  const fams = new Set(list.map(p=>p.fam)).size;
  let h = `<div class="status"><span><b>${list.length}</b> of ${P.length} patents · ${fams} ${fams===1?'family':'families'}</span>${pills}${(pills||state.q)?'<button class="btn" id="clear" style="padding:2px 10px;font-size:12.5px">Clear all</button>':''}<span class="spacer" style="flex:1"></span><button class="btn" id="csv" style="padding:2px 10px;font-size:12.5px">Export CSV</button></div>`;
  if (!list.length) h += `<div class="empty">No patents match. Try fewer words or clear the filters.</div>`;
  h += list.slice(0, state.limit).map(p => card(p, list.length === 1)).join('');
  if (list.length > state.limit) h += `<button class="btn more" id="more">Show more (${list.length - state.limit} remaining)</button>`;
  $('#main').innerHTML = h;
  document.querySelectorAll('details.card[open] .body').forEach(b => b.innerHTML = body(byN[b.dataset.n]));
  window._list = list;
}
function renderIndex(kind){
  $('#side').innerHTML = '';
  let h = '';
  if (kind === 'concepts'){
    h += `<p class="note">Technical concepts named in the summaries, grouped by theme. Counts are patents. Click one to list its patents.</p><div class="idx">`;
    for (const t of Object.keys(THEMES)){
      const c = counts(P.filter(p=>p.F.theme===t), p=>p.F.concepts).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));
      if (!c.length) continue;
      h += `<section><h3>${esc(THEMES[t])}</h3>${c.map(([k,n])=>`<button data-set="concept" data-val="${esc(k)}" data-theme="${t}"><span>${esc(k)}</span><span class="ct">${n}</span></button>`).join('')}</section>`;
    }
    h += '</div>';
  } else {
    h += `<p class="note">Use cases the patents put forward, grouped by application area. Each block is one patent family with its use cases; the count is the number of patents in the family. A family tagged with several areas appears under each. Click a family to list its patents.</p><div class="idx uses">`;
    const areas = counts(P, p=>p.F.useTags).sort((a,b)=>b[1]-a[1]);
    for (const [a] of areas){
      const fs = Object.entries(FAM).filter(([,f])=>f.useTags.includes(a)).sort((x,y)=>y[1].members.length-x[1].members.length);
      h += `<section><h3><a href="#" data-set="use" data-val="${esc(a)}">${esc(a)}</a></h3>${fs.map(([id,f])=>`<div class="fam"><button data-set="fam" data-val="${id}"><span>${esc(f.title)}</span><span class="ct">${f.members.length}</span></button><ul>${f.uses.map(u=>`<li>${esc(u)}</li>`).join('')}</ul></div>`).join('')}</section>`;
    }
    h += '</div>';
  }
  $('#main').innerHTML = h;
}
function renderFamilies(){
  $('#side').innerHTML = '';
  const fs = Object.entries(FAM).sort((a,b)=> b[1].members.length - a[1].members.length || a[1].title.localeCompare(b[1].title));
  $('#main').innerHTML = `<p class="note">${fs.length} families. A family here is a set of patents sharing a specification (continuations, divisionals and continuations-in-part, linked through USPTO continuity data). Members share one summary; each patent has its own claim focus.</p>
  <table><thead><tr><th>Family</th><th>Patents</th><th>Theme</th><th>Earliest priority</th><th>Summary</th></tr></thead><tbody>${fs.map(([id,f])=>
    `<tr><td><a href="#" data-set="fam" data-val="${id}">${esc(f.title)}</a></td><td>${f.members.length}</td><td>${esc(THEMES[f.theme])}</td><td>${f.prio}</td><td>${esc(f.summary)}</td></tr>`).join('')}</tbody></table>`;
}
function renderAbout(){
  $('#side').innerHTML = '';
  const s = D.source;
  $('#main').innerHTML = `<div style="max-width:900px">
  <h2 style="margin-top:0">About the data</h2>
  <p>Built ${esc(D.built)}. ${esc(s.intro||'')} ${P.length} US granted patents are included, in ${Object.keys(FAM).length} families. Bibliographic data, abstracts and claims come from USPTO Patent Public Search; PDFs are the USPTO's full-document page images, saved in <code>${esc(D.pdfDir)}/</code>, with the full USPTO text of each patent in <code>${esc(D.textDir)}/</code>.</p>
  ${s.query?`<p>Search query: <code>${esc(s.query)}</code></p>`:''}
  <p>Summaries, claim focus lines, concepts and use cases were written by Claude from each patent's abstract and first independent claim. They are a reading aid, not a legal analysis: the claims in the PDF are the authority on scope, and use cases are a reading of what the claimed mechanism is for. The abstract and claim 1 shown on each card are verbatim USPTO text.</p>
  ${(s.removed||[]).length?`<h3>Left out</h3>
  <table><thead><tr><th>Reason</th><th>Count</th><th>Examples</th></tr></thead><tbody>${s.removed.map(r=>`<tr><td>${esc(r.reason)}</td><td>${r.count}</td><td>${esc(r.examples)}</td></tr>`).join('')}</tbody></table>`:''}
  ${(s.notes||[]).length?`<h3 style="margin-top:20px">Notes</h3>
  <table><thead><tr><th>Entry</th><th>Note</th></tr></thead><tbody>${s.notes.map(r=>`<tr><td>${esc(r.entry)}</td><td>${esc(r.note)}</td></tr>`).join('')}</tbody></table>`:''}
  </div>`;
}
function render(){
  document.querySelector('.layout').classList.toggle('wide', state.view !== 'list');
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.view === state.view));
  $('#sub').textContent = `${P.length} US patents · ${Object.keys(FAM).length} families`;
  ({list:renderList, concepts:()=>renderIndex('concepts'), uses:()=>renderIndex('uses'), families:renderFamilies, about:renderAbout})[state.view]();
  const h = new URLSearchParams(); for (const k of ['view','q','sort','theme','concept','use','inv','year','fam']) if (state[k] && !(k==='view'&&state[k]==='list') && !(k==='sort'&&state[k]==='rel')) h.set(k, state[k]);
  history.replaceState(null, '', h.toString() ? '#' + h.toString() : location.pathname + location.search);
}
function setFilter(k, v, toggle = true){
  state[k] = (toggle && state[k] === v) ? '' : v; state.view = 'list'; state.limit = 60; render(); window.scrollTo(0,0);
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-set],[data-goto],[data-view],#more,#clear,#csv,#themeBtn,#filt');
  if (!t) return;
  if (t.dataset.view){ state.view = t.dataset.view; render(); window.scrollTo(0,0); return; }
  if (t.dataset.set){ e.preventDefault(); if (t.dataset.theme) state.theme = t.dataset.theme; setFilter(t.dataset.set, t.dataset.val, t.closest('aside,.status') != null); return; }
  if (t.dataset.goto){ e.preventDefault(); Object.assign(state,{view:'list',q:t.dataset.goto,theme:'',concept:'',use:'',inv:'',year:'',fam:''}); document.title = D.title; $('#h1').textContent = D.title;
$('#q').value = state.q; render(); window.scrollTo(0,0); return; }
  if (t.id === 'more'){ state.limit += 100; render(); return; }
  if (t.id === 'clear'){ Object.assign(state,{q:'',theme:'',concept:'',use:'',inv:'',year:'',fam:''}); $('#q').value=''; render(); return; }
  if (t.id === 'filt'){ $('#side').classList.toggle('show'); return; }
  if (t.id === 'themeBtn'){
    const dark = (document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')) === 'dark';
    document.documentElement.dataset.theme = dark ? 'light' : 'dark';
    try { localStorage.setItem('patent-browser-theme', document.documentElement.dataset.theme); } catch(_){}
    return;
  }
  if (t.id === 'csv'){
    const q = s => '"' + String(s).replace(/"/g,'""') + '"';
    const rows = [['patent','kind','title','granted','priority','filed','application','inventors','theme','concepts','use_areas','claim_focus','family_summary','pdf']]
      .concat((window._list||[]).map(p => [p.n,p.kind,p.title,p.granted,p.prio,p.filed,p.app,p.inv.join('; '),THEMES[p.F.theme],p.F.concepts.join('; '),p.F.useTags.join('; '),p.focus,p.F.summary,p.pdf]));
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([rows.map(r=>r.map(q).join(',')).join('\n')], {type:'text/csv'}));
    a.download = D.name + '-patents-filtered.csv'; a.click();
  }
});
document.addEventListener('toggle', e => {
  const d = e.target; if (!d.classList || !d.classList.contains('card') || !d.open) return;
  const b = d.querySelector('.body'); if (!b.innerHTML) b.innerHTML = body(byN[b.dataset.n]);
}, true);
let timer; $('#q').addEventListener('input', e => { clearTimeout(timer); timer = setTimeout(() => { state.q = e.target.value.trim(); state.view = 'list'; state.limit = 60; render(); }, 120); });
$('#sort').addEventListener('change', e => { state.sort = e.target.value; render(); });
document.addEventListener('keydown', e => { if (e.key === '/' && document.activeElement !== $('#q')) { e.preventDefault(); $('#q').focus(); } });
try { const t = localStorage.getItem('patent-browser-theme'); if (t) document.documentElement.dataset.theme = t; } catch(_){}
new URLSearchParams(location.hash.slice(1)).forEach((v,k) => { if (k in state) state[k] = v; });
document.title = D.title; $('#h1').textContent = D.title;
$('#q').value = state.q; $('#sort').value = state.sort;
render();
</script>
</body>
</html>
